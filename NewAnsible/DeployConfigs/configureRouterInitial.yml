- name: Initial Configs For Newly Deployed Router
  hosts: ios_routers
  gather_facts: false
  connection: network_cli
  tasks:
    # ---------------------------------------------------------------------
    # STEP 0: FQDN and no damned dns lookup
    # ---------------------------------------------------------------------
    - name: Set domain name and lookup parameters
      cisco.ios.ios_system:
        hostname: "{{ inventory_hostname }}"
        domain_name: "{{ domain_name }}"
        state: present

    - name: Disable DNS lookup
      cisco.ios.ios_config:
        lines:
          - no ip domain-lookup

    # ---------------------------------------------------------------------
    # STEP 1: Create the management interface FIRST Loopback
    # before anything else references it as a source-interface.
    # ---------------------------------------------------------------------
    - name: Create Loopback0 interface
      cisco.ios.ios_interfaces:
        config:
          - name: Loopback0
            description: "Management/Router-ID Loopback"
            enabled: true
        state: merged

    - name: Configure Loopback0 IP address
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Loopback0
            ipv4:
              - address: "{{ mgmt_ip }}"  # CIDR notation, e.g. 10.0.0.1/32
        state: merged

    # ---------------------------------------------------------------------
    # STEP 2: Common baseline config, create local users
    # ---------------------------------------------------------------------
    - name: Create local users
      cisco.ios.ios_user:
        name: "{{ item.name }}"
        configured_password: "{{ item.password }}"
        privilege: "{{ item.privilege }}"
        state: present
      loop:
        - { name: "{{ admin_username }}", password: "{{ admin_password }}", privilege: 15 }
      no_log: true

    # ---------------------------------------------------------------------
    # STEP 3: SSH assurance
    # ---------------------------------------------------------------------
    # Ansible relies on SSH, so no need to regenerate rsa keys
    # - name: Generate RSA key
    #   tags:
    #     - L2
    #     - L3
    #   cisco.ios.ios_command:
    #     commands:
    #       - crypto key generate rsa modulus 2048
    #   ignore_errors: true

    - name: Configure SSH access ACL
      cisco.ios.ios_acls:
        config:
          - afi: ipv4
            acls:
              - name: SSH_ACCESS
                acl_type: extended
                aces:
                  - grant: permit
                    protocol: tcp
                    source:
                      address: 192.168.197.0
                      wildcard_bits: 0.0.0.255
                    destination:
                      any: true
                      port_protocol:
                        eq: 22
        state: merged

    - name: Enable SSH version 2
      cisco.ios.ios_config:
        lines:
          - ip ssh version 2
          - ip ssh time-out 60
          - ip ssh authentication-retries 3

    - name: Configure VTY lines
      cisco.ios.ios_config:
        parents:
          - line vty 0 15
        lines:
          - login local
          - transport input ssh
          - access-class SSH_ACCESS in
          - exec-timeout 10 0
          - logging synchronous

    # ---------------------------------------------------------------------
    # STEP 4: Timezone and NTP
    # ---------------------------------------------------------------------
    - name: Set timezone
      cisco.ios.ios_config:
        lines:
          - clock timezone GMT +5

    - name: Configure NTP servers
      cisco.ios.ios_ntp_global:
        config:
          servers:
            - server: "{{ ntp_server_ip }}"
              prefer: true
        state: merged

    - name: Configure NTP source interface loopback 0
      cisco.ios.ios_ntp_global:
        config:
          source: Loopback0
        state: merged

    # ---------------------------------------------------------------------
    # STEP 5: Logging
    # ---------------------------------------------------------------------
    - name: Configure logging
      cisco.ios.ios_logging_global:
        config:
          buffered:
            severity: informational
            size: 16384
          console:
            severity: warnings
          hosts:
            - hostname: "{{ syslog_ip }}"
          trap: informational
        state: merged

    - name: Configure logging source interface
      tags: L3
      cisco.ios.ios_logging_global:
        config:
          source_interface:
            - interface: Loopback0
        state: merged

    # ---------------------------------------------------------------------
    # STEP 6: SNMP server
    # ---------------------------------------------------------------------
    - name: Create SNMP access ACL
      cisco.ios.ios_acls:
        config:
          - afi: ipv4
            acls:
              - name: SNMP_ACCESS
                acl_type: standard
                aces:
                  - grant: permit
                    source:
                      address: 192.168.197.0
                      wildcard_bits: 0.0.0.255
        state: merged

    - name: Configure SNMP
      cisco.ios.ios_snmp_server:
        config:
          communities:
            - name: "{{ nms_community }}"   # avoid default string 'public'
              acl_v4: SNMP_ACCESS
              ro: true
        state: merged

    - name: Configure SNMP trap source interface
      cisco.ios.ios_snmp_server:
        config:
          trap_source: Loopback0
        state: merged

    - name: Enable all SNMP traps
      cisco.ios.ios_config:
        lines:
          - snmp-server enable traps

    - name: Define SNMP trap receiver (NMS)
      cisco.ios.ios_snmp_server:
        config:
          hosts:
            - host: "{{ nms_ip }}"
              community_string: "{{ nms_community }}"
              version: "2c"
        state: merged

    # ---------------------------------------------------------------------
    # STEP 7: Configure CDP and LLDP for NMS
    # ---------------------------------------------------------------------
    - name: Enable CDP
      cisco.ios.ios_config:
        lines:
          - cdp run

    - name: Enable LLDP
      cisco.ios.ios_config:
        lines:
          - lldp run

    # ---------------------------------------------------------------------
    # STEP 8: Configure banner
    # ---------------------------------------------------------------------
    - name: Configure banners
      cisco.ios.ios_banner:
        banner: motd
        text: |
          ***************************************
          Unauthorized access is prohibited.
          All activity is logged and monitored.
          CCNP LAB 101
          ***************************************
        state: present

    # ---------------------------------------------------------------------
    # STEP 9: Device Hardening
    # ---------------------------------------------------------------------
    - name: Device hardening - global commands
      cisco.ios.ios_config:
        lines:
          - no ip http server
          - no ip http secure-server
          - no ip bootp server
          - login block-for 120 attempts 3 within 60
          - login on-failure log
          - login on-success log
          - no ip source-route

    - name: Device hardening - console line
      cisco.ios.ios_config:
        parents:
          - line con 0
        lines:
          - exec-timeout 10 0
          - logging synchronous

    - name: Device hardening - services and timestamps
      cisco.ios.ios_service:
        config:
          pad: false
          password_encryption: true
          tcp_keepalives_in: true
          tcp_keepalives_out: true
          timestamps:
            - msg: log
              enable: true
              timestamp: datetime
              datetime_options:
                localtime: true
                msec: true
                show_timezone: true
                year: true
            - msg: debug
              enable: true
              timestamp: datetime
              datetime_options:
                localtime: true
                msec: true
                show_timezone: true
                year: true
        state: merged

    # ---------------------------------------------------------------------
    # STEP LAST: Save Configuration
    # ---------------------------------------------------------------------
    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified

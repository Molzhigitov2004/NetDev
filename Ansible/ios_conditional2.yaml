- name: IOS command output for when clause
  hosts: ios_devices
  gather_facts: false
  tasks:
    - name: show hostname
      ios_command:
        commands:
          - show run | i hostname
      register: output

    - name: show output with when conditions
      when: output.stdout == ["hostname EDGE_R1"]
      ios_config:
        lines:
          - int loop 69
          - ip addr 69.69.69.69 255.255.255.255
        
